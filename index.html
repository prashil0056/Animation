<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gaming Laptop Showcase</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="hero">

        <div class="hero-content">

            <span class="badge">NEW RELEASE</span>

            <h1>RTX 5070<br>Gaming Beast</h1>

            <p>
                Built for gamers who demand extreme performance,
                stunning visuals and blazing-fast speed.
            </p>

            <button class="hero-button">
                Explore Laptop
            </button>

        </div>


        <div class="laptop-area">

            <div class="laptop-glow"></div>

            <div class="laptop">

                <div class="screen">
                    <span>GAME</span>
                </div>

                <div class="keyboard">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>

        </div>

    </main>


    <section class="specs">

        <div class="spec-card">
            <h2>RTX 5070</h2>
            <p>Graphics</p>
        </div>

        <div class="spec-card">
            <h2>32 GB</h2>
            <p>DDR5 RAM</p>
        </div>

        <div class="spec-card">
            <h2>240 Hz</h2>
            <p>Display</p>
        </div>

        <div class="spec-card">
            <h2>1 TB</h2>
            <p>NVMe SSD</p>
        </div>

    </section>


    <section class="cta">

        <h2>Ready to dominate?</h2>

        <button>Buy Now</button>

    </section>

</body>

</html>
